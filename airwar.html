<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Warriors</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  overflow:hidden
}
#gameContainer{
  position:relative;
  width:960px;
  height:720px
}
canvas{
  display:block;
  background:#0a0a1a;
  border:2px solid #333;
  cursor:none
}
.overlay{
  position:absolute;
  top:0;left:0;
  width:960px;height:720px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.85);
  z-index:10
}
.overlay.hidden{display:none}
.overlay h1{color:#4fc3f7;font-size:48px;margin-bottom:10px;text-shadow:0 0 20px rgba(79,195,247,0.5)}
.overlay h2{color:#fff;font-size:22px;margin-bottom:24px;font-weight:400}
.overlay p{color:#fff;font-size:16px;margin:6px 0;text-align:center}
.btn-group{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{
  padding:14px 36px;
  font-size:18px;
  border:2px solid #4fc3f7;
  background:transparent;
  color:#4fc3f7;
  cursor:pointer;
  border-radius:6px;
  transition:all .3s;
  font-family:inherit;
  font-weight:600;
  letter-spacing:1px
}
.btn:hover{background:#4fc3f7;color:#111}
.btn-easy{border-color:#4caf50;color:#4caf50}
.btn-easy:hover{background:#4caf50;color:#111}
.btn-medium{border-color:#ff9800;color:#ff9800}
.btn-medium:hover{background:#ff9800;color:#111}
.btn-hard{border-color:#f44336;color:#f44336}
.btn-hard:hover{background:#f44336;color:#111}
#hud{
  position:absolute;
  top:8px;left:8px;right:8px;
  display:flex;
  justify-content:space-between;
  color:#fff;
  font-size:15px;
  z-index:5;
  pointer-events:none;
  font-family:'Courier New',monospace
}
#hud span{
  padding:4px 10px;
  background:rgba(0,0,0,0.6);
  border-radius:3px;
  border:1px solid rgba(255,255,255,0.1)
}
#hud .attack-warn{color:#ff6f00;font-weight:700;border-color:#ff6f00}
#hud .attack-active{color:#f44336;font-weight:700;border-color:#f44336;animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.6}to{opacity:1}}
#gameOverOverlay .final-score{color:#ff9800;font-size:32px;font-weight:700}
#gameOverOverlay .final-stage{color:#aaa;font-size:18px;margin-top:4px}
#stageOverlay h1{font-size:56px}
#stageOverlay p{color:#aaa;font-size:18px;margin-top:4px}
.controls-info{color:#555!important;font-size:13px!important;margin-top:24px!important}
.controls-info kbd{
  display:inline-block;
  padding:2px 8px;
  background:#222;
  border:1px solid #444;
  border-radius:3px;
  font-size:12px;
  color:#aaa;
  font-family:monospace
}
</style>
</head>
<body>
<div id="gameContainer">
<canvas id="gameCanvas"></canvas>
<div id="hud">
  <span id="scoreDisplay">SCORE: 0</span>
  <span id="livesDisplay">LIVES: 5</span>
  <span id="stageDisplay">STAGE: 1</span>
  <span id="diffDisplay">EASY</span>
  <span id="attackStatus">READY</span>
</div>
<div id="menuOverlay" class="overlay">
  <h1>SKY WARRIORS</h1>
  <h2>Select Difficulty</h2>
  <div class="btn-group">
    <button class="btn btn-easy" onclick="startGame('easy')">EASY (15s)</button>
    <button class="btn btn-medium" onclick="startGame('medium')">MEDIUM (10s)</button>
    <button class="btn btn-hard" onclick="startGame('hard')">HARD (5s)</button>
  </div>
  <p class="controls-info"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move &nbsp;|&nbsp; <kbd>SPACE</kbd> Fire</p>
</div>
<div id="stageOverlay" class="overlay hidden">
  <h1 id="stageTitle">STAGE 1</h1>
  <p id="stageSub">Get Ready!</p>
</div>
<div id="gameOverOverlay" class="overlay hidden">
  <h1>GAME OVER</h1>
  <p class="final-score" id="finalScore">SCORE: 0</p>
  <p class="final-stage" id="finalStage">Reached Stage 1</p>
  <button class="btn" onclick="showMenu()" style="margin-top:20px">PLAY AGAIN</button>
</div>
</div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const W=960,H=720;
canvas.width=W;canvas.height=H;

const ENEMY_W=30,ENEMY_H=30;
const BOSS_W=44,BOSS_H=44;
const PLAYER_W=30,PLAYER_H=36;
const BULLET_W=4,BULLET_H=10;
const GRID_COLS=10;
const GRID_LEFT=240,GRID_TOP=80;
const CELL_W=48,CELL_H=42;
const PLAYER_SPEED=280;
const PLAYER_BULLET_SPEED=520;
const ENEMY_BULLET_SPEED=200;
const FIRE_COOLDOWN=0.18;
const ATK_WAVE_INTERVAL=3;
const INVINCIBLE_TIME=2;
const DIFF_TIMERS={easy:15,medium:10,hard:5};
const MAX_BULLETS=15;

const hudScore=document.getElementById('scoreDisplay');
const hudLives=document.getElementById('livesDisplay');
const hudStage=document.getElementById('stageDisplay');
const hudDiff=document.getElementById('diffDisplay');
const hudAttack=document.getElementById('attackStatus');
const menuOverlay=document.getElementById('menuOverlay');
const stageOverlay=document.getElementById('stageOverlay');
const gameOverOverlay=document.getElementById('gameOverOverlay');
const stageTitle=document.getElementById('stageTitle');
const stageSub=document.getElementById('stageSub');
const finalScore=document.getElementById('finalScore');
const finalStage=document.getElementById('finalStage');

let state='menu';
let stage=1,score=0,lives=5;
let difficulty='medium';
let attackTimer=0,attackActive=false,atkWaveTimer=0,waveNumber=0,formationPhase=0;
let player=null;
let enemies=[],bosses=[],pBullets=[],eBullets=[],stars=[];
const keys={};
let fireCd=0,invTimer=0,transTimer=0;

function initStars(){
  stars=[];
  for(let i=0;i<100;i++)stars.push({
    x:Math.random()*W,
    y:Math.random()*H,
    size:Math.random()*2+0.5,
    speed:20+Math.random()*50,
    alpha:0.3+Math.random()*0.7
  });
}
initStars();

function hit(a,b){
  return Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs(a.y-b.y)<(a.h+b.h)/2;
}

function initStage(){
  enemies=[];bosses=[];pBullets=[];eBullets=[];
  const totalPlanes=Math.min(40+(stage-1)*6,120);
  const totalRows=Math.ceil(totalPlanes/10);
  let placed=0;
  for(let r=0;r<totalRows&&placed<totalPlanes;r++){
    const cols=Math.min(10,totalPlanes-placed);
    const rowOff=(10-cols)*CELL_W/2;
    for(let c=0;c<cols;c++){
      enemies.push({
        x:GRID_LEFT+rowOff+c*CELL_W+ENEMY_W/2,
        y:GRID_TOP+r*CELL_H+ENEMY_H/2,
        w:ENEMY_W,h:ENEMY_H,
        hp:1,state:'formation',
        originX:GRID_LEFT+rowOff+c*CELL_W+ENEMY_W/2,
        originY:GRID_TOP+r*CELL_H+ENEMY_H/2,
        shootT:1+Math.random()*2,
        wobble:Math.random()*Math.PI*2
      });
      placed++;
    }
  }
  const bCnt=stage;
  const gridW=GRID_COLS*CELL_W;
  const bSpc=gridW/(bCnt+1);
  for(let i=0;i<bCnt;i++){
      bosses.push({
        x:GRID_LEFT+(i+1)*bSpc,
        y:GRID_TOP-38,
        w:BOSS_W,h:BOSS_H,
        hp:3,state:'formation',
        originX:GRID_LEFT+(i+1)*bSpc,
        originY:GRID_TOP-38,
        shootT:0.5+Math.random()*1,
        wobble:Math.random()*Math.PI*2
      });
  }
  player={x:W/2,y:H-48,w:PLAYER_W,h:PLAYER_H};
  attackTimer=Math.max(0,DIFF_TIMERS[difficulty]-(stage-1)*1.5);
  attackActive=false;
  atkWaveTimer=0;
  invTimer=0;
  fireCd=0;
  formationPhase=0;
  waveNumber=0;
}

function startGame(diff){
  difficulty=diff;
  stage=1;score=0;lives=5;
  state='playing';
  menuOverlay.classList.add('hidden');
  gameOverOverlay.classList.add('hidden');
  initStage();
  updateHUD();
}

function showMenu(){
  state='menu';
  menuOverlay.classList.remove('hidden');
  gameOverOverlay.classList.add('hidden');
  stageOverlay.classList.add('hidden');
}

function gameOverFn(){
  state='gameOver';
  finalScore.textContent='SCORE: '+score;
  finalStage.textContent='Reached Stage '+stage;
  gameOverOverlay.classList.remove('hidden');
}

function nextStage(){
  stage++;
  state='playing';
  stageOverlay.classList.add('hidden');
  initStage();
  updateHUD();
}

function checkStageClear(){
  if(enemies.length===0&&bosses.length===0){
    state='stageTransition';
    transTimer=3;
    stageTitle.textContent='STAGE '+stage+' CLEAR!';
    stageSub.textContent='Next stage in 3...';
    stageOverlay.classList.remove('hidden');
  }
}

function updateHUD(){
  hudScore.textContent='SCORE: '+score;
  hudLives.textContent='LIVES: '+lives;
  hudStage.textContent='STAGE: '+stage;
  hudDiff.textContent=difficulty.toUpperCase();
  if(attackActive){
    hudAttack.textContent='ATTACKING!';
    hudAttack.className='attack-active';
  }else if(attackTimer>0){
    const t=Math.ceil(attackTimer);
    hudAttack.textContent='ATK: '+t+'s';
    hudAttack.className='';
  }else{
    hudAttack.textContent='';
    hudAttack.className='';
  }
}

function update(dt){
  if(state==='playing'){
    updatePlayer(dt);
    updateBullets(dt);
    updateFormationSway(dt);
    updateEnemies(dt);
    updateBosses(dt);
    updateAttackTimer(dt);
    checkCollisions();
    checkStageClear();
    updateHUD();
  }else if(state==='stageTransition'){
    transTimer-=dt;
    stageSub.textContent='Next stage in '+Math.ceil(transTimer)+'...';
    if(transTimer<=0)nextStage();
  }
  updateStars(dt);
}

function updatePlayer(dt){
  if(!player)return;
  let dx=0,dy=0;
  if(keys['w']||keys['arrowup'])dy=-1;
  if(keys['s']||keys['arrowdown'])dy=1;
  if(keys['a']||keys['arrowleft'])dx=-1;
  if(keys['d']||keys['arrowright'])dx=1;
  if(dx&&dy){dx*=0.7071;dy*=0.7071}
  player.x+=dx*PLAYER_SPEED*dt;
  player.y+=dy*PLAYER_SPEED*dt;
  player.x=Math.max(player.w/2,Math.min(W-player.w/2,player.x));
  player.y=Math.max(player.h/2,Math.min(H-player.h/2,player.y));
  if(fireCd>0)fireCd-=dt;
  if((keys[' ']||keys['space'])&&fireCd<=0&&pBullets.length<MAX_BULLETS){
    pBullets.push({x:player.x,y:player.y-player.h/2-BULLET_H/2,w:BULLET_W,h:BULLET_H});
    fireCd=FIRE_COOLDOWN;
  }
  if(invTimer>0)invTimer-=dt;
}

function updateBullets(dt){
  for(let i=pBullets.length-1;i>=0;i--){
    pBullets[i].y-=PLAYER_BULLET_SPEED*dt;
    if(pBullets[i].y+pBullets[i].h/2<0)pBullets.splice(i,1);
  }
  for(let i=eBullets.length-1;i>=0;i--){
    eBullets[i].y+=ENEMY_BULLET_SPEED*dt;
    if(eBullets[i].y-eBullets[i].h/2>H)eBullets.splice(i,1);
  }
}

function updateEnemies(dt){
  const enemySpd=PLAYER_SPEED/1.1;
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.state==='attacking'){
      e.y+=enemySpd*dt;
      const dx=player.x-e.x;
      e.x+=dx*2.2*dt;
      e.x+=Math.sin(e.wobble)*22*dt;
      e.wobble+=dt*3;
      e.shootT-=dt;
      if(e.shootT<=0){
        eBullets.push({x:e.x,y:e.y+e.h/2+BULLET_H/2,w:BULLET_W,h:BULLET_H});
        e.shootT=1+Math.random()*2;
      }
      if(e.y-e.h/2>H){
        e.state='returning';
        e.wobble=Math.random()*Math.PI*2;
      }
    }else if(e.state==='returning'){
      const dx=e.originX-e.x;
      const dy=e.originY-e.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      const retSpeed=H/1.2;
      if(dist>5){
        e.x+=(dx/dist)*retSpeed*dt;
        e.y+=(dy/dist)*retSpeed*dt;
        e.x+=Math.sin(e.wobble)*0.5;
        e.wobble+=dt*3;
      }else{
        e.x=e.originX;
        e.y=e.originY;
        e.state='attacking';
        e.shootT=1+Math.random()*2;
      }
    }
  }
}

function updateBosses(dt){
  const bossSpd=(PLAYER_SPEED/1.1)*1.5;
  for(let i=bosses.length-1;i>=0;i--){
    const b=bosses[i];
    if(b.state==='attacking'){
      b.y+=bossSpd*dt;
      const dx=player.x-b.x;
      b.x+=dx*2.2*1.5*dt;
      b.x+=Math.sin(b.wobble)*22*1.5*dt;
      b.wobble+=dt*3;
      b.shootT-=dt;
      if(b.shootT<=0){
        eBullets.push({x:b.x,y:b.y+b.h/2+BULLET_H/2,w:BULLET_W,h:BULLET_H});
        b.shootT=0.5+Math.random()*1;
      }
      if(b.y-b.h/2>H){
        b.state='returning';
        b.wobble=Math.random()*Math.PI*2;
      }
    }else if(b.state==='returning'){
      const dx=b.originX-b.x;
      const dy=b.originY-b.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      const retSpeed=(H/1.2)*1.5;
      if(dist>5){
        b.x+=(dx/dist)*retSpeed*dt;
        b.y+=(dy/dist)*retSpeed*dt;
        b.x+=Math.sin(b.wobble)*0.5;
        b.wobble+=dt*3;
      }else{
        b.x=b.originX;
        b.y=b.originY;
        b.state='attacking';
        b.shootT=0.5+Math.random()*1;
      }
    }
  }
}

function updateAttackTimer(dt){
  if(attackActive){
    atkWaveTimer+=dt;
    while(atkWaveTimer>=ATK_WAVE_INTERVAL){
      atkWaveTimer-=ATK_WAVE_INTERVAL;
      waveNumber++;
      const waveSize=waveNumber*2;
      let cnt=0;
      for(const e of enemies){
        if(e.state==='formation'){
          e.state='attacking';
          cnt++;
          if(cnt>=waveSize)break;
        }
      }
      for(const b of bosses){
        if(b.state==='formation'){
          b.state='attacking';
          cnt++;
          if(cnt>=waveSize)break;
        }
      }
    }
  }else{
    attackTimer-=dt;
    if(attackTimer<=0){
      attackActive=true;
      atkWaveTimer=ATK_WAVE_INTERVAL;
      waveNumber=0;
    }
  }
}

function checkCollisions(){
  if(!player||invTimer>0)return;
  for(let i=pBullets.length-1;i>=0;i--){
    const b=pBullets[i];
    let hitS=false;
    for(let j=enemies.length-1;j>=0;j--){
      if(hit(b,enemies[j])){
        enemies[j].hp--;
        if(enemies[j].hp<=0){enemies.splice(j,1);score+=1}
        hitS=true;break;
      }
    }
    if(!hitS){
      for(let j=bosses.length-1;j>=0;j--){
        if(hit(b,bosses[j])){
          bosses[j].hp--;
          if(bosses[j].hp<=0){bosses.splice(j,1);score+=3}
          hitS=true;break;
        }
      }
    }
    if(hitS)pBullets.splice(i,1);
  }
  for(let i=eBullets.length-1;i>=0;i--){
    if(hit(eBullets[i],player)){eBullets.splice(i,1);playerHit();return}
  }
  for(let i=enemies.length-1;i>=0;i--){
    if(enemies[i].state!=='formation'&&hit(enemies[i],player)){enemies.splice(i,1);playerHit();return}
  }
  for(let i=bosses.length-1;i>=0;i--){
    if(bosses[i].state!=='formation'&&hit(bosses[i],player)){playerHit();return}
  }
}

function playerHit(){
  lives--;
  invTimer=INVINCIBLE_TIME;
  if(lives<=0)gameOverFn();
  updateHUD();
}

function updateStars(dt){
  for(const s of stars){
    s.y+=s.speed*dt;
    if(s.y>H){s.y=0;s.x=Math.random()*W}
  }
}

function updateFormationSway(dt){
  const travelTime=Math.max(0.5,2.5-(stage-1)*0.3);
  const speed=H/travelTime;
  const swayRange=80;
  formationPhase+=dt;
  const offset=Math.sin(formationPhase*speed/swayRange)*swayRange;
  for(const e of enemies){
    if(e.state==='formation')e.x=e.originX+offset;
  }
  for(const b of bosses){
    if(b.state==='formation')b.x=b.originX+offset;
  }
}

function draw(){
  ctx.fillStyle='#0a0a1a';
  ctx.fillRect(0,0,W,H);
  drawStars();
  if(state==='playing'||state==='stageTransition'||state==='gameOver'){
    drawBosses();
    drawEnemies();
    drawPlayer();
    drawBullets();
    if(state==='gameOver')drawGameOverScene();
  }
}

function drawStars(){
  for(const s of stars){
    ctx.globalAlpha=s.alpha;
    ctx.fillStyle='#fff';
    ctx.fillRect(s.x,s.y,s.size,s.size);
  }
  ctx.globalAlpha=1;
}

function drawPlayer(){
  if(!player)return;
  if(invTimer>0&&Math.floor(performance.now()/80)%2===0)return;
  const p=player;
  ctx.save();ctx.translate(p.x,p.y);
  ctx.fillStyle='#4fc3f7';
  ctx.beginPath();
  ctx.moveTo(0,-p.h/2);
  ctx.lineTo(-p.w/2,p.h*0.25);
  ctx.lineTo(-p.w*0.3,p.h*0.25);
  ctx.lineTo(-p.w*0.3,p.h/2);
  ctx.lineTo(p.w*0.3,p.h/2);
  ctx.lineTo(p.w*0.3,p.h*0.25);
  ctx.lineTo(p.w/2,p.h*0.25);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle='#81d4fa';
  ctx.beginPath();
  ctx.ellipse(0,-p.h*0.2,p.w*0.2,p.h*0.18,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#ff9100';
  ctx.fillRect(-3,p.h/2-2,6,4);
  ctx.resetTransform();
  ctx.restore();
}

function drawEnemies(){
  for(const e of enemies){
    ctx.save();ctx.translate(e.x,e.y);
    ctx.fillStyle=e.state==='formation'?'#e53935':e.state==='returning'?'#7e57c2':'#ff6f00';
    ctx.beginPath();
    ctx.moveTo(0,e.h/2);
    ctx.lineTo(-e.w/2,-e.h/2);
    ctx.lineTo(e.w/2,-e.h/2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle=e.state==='formation'?'#ffcdd2':e.state==='returning'?'#d1c4e9':'#ffcc80';
    ctx.fillRect(-e.w/4,-e.h/4,e.w/2,e.h*0.2);
    ctx.restore();
  }
}

function drawBosses(){
  for(const b of bosses){
    ctx.save();ctx.translate(b.x,b.y);
    ctx.fillStyle='#7b1fa2';
    ctx.beginPath();
    ctx.moveTo(0,b.h/2);
    ctx.lineTo(-b.w/2,-b.h/2);
    ctx.lineTo(b.w/2,-b.h/2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle='#ce93d8';
    ctx.fillRect(-b.w/3,-b.h/3,b.w*2/3,b.h*0.25);
    ctx.fillStyle='#fff';
    ctx.font='11px monospace';
    ctx.textAlign='center';
    ctx.textBaseline='top';
    ctx.fillText('❤'.repeat(b.hp),0,b.h/2+4);
    ctx.restore();
  }
}

function drawBullets(){
  ctx.fillStyle='#ffff00';
  ctx.shadowColor='#ffff00';
  ctx.shadowBlur=4;
  for(const b of pBullets){
    ctx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);
  }
  ctx.shadowBlur=0;
  ctx.fillStyle='#ff1744';
  for(const b of eBullets){
    ctx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);
  }
}

function drawGameOverScene(){
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.fillRect(0,0,W,H);
}

document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k===' '){keys[' ']=true;e.preventDefault()}
  else keys[k.toLowerCase()]=true;
});
document.addEventListener('keyup',e=>{
  const k=e.key;
  if(k===' ')keys[' ']=false;
  else keys[k.toLowerCase()]=false;
});

let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000,0.05);
  lastT=t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(t=>{lastT=t;loop(t)});
</script>
</body>
</html>
